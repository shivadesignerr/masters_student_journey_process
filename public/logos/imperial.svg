<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Imperial College London Logo Banner -->
  <g transform="translate(15, 12)">
    <!-- Imperial Shield / Block Crest -->
    <rect x="0" y="4" width="48" height="48" rx="8" fill="#002147"/>
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">IC</text>
  </g>
  <text x="75" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#002147" letter-spacing="1">Imperial College</text>
  <text x="75" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#002147" letter-spacing="3">London</text>
</svg>
