    <path d="M25 4 L48 10 V36 C48 48 38 56 25 60 C12 56 2 48 2 36 V10 Z" fill="#990000" stroke="#B8860B" stroke-width="2"/>
    <!-- Double-headed lion & book elements inside shield -->
