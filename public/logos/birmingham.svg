    <path d="M18 36 C18 32 32 32 32 36 V46 C32 49 18 49 18 46 Z" fill="#FFC72C"/>
    <path d="M12 28 C10 24 14 20 18 24 M38 28 C40 24 36 20 32 24" stroke="#FFC72C" stroke-width="2" fill="none"/>
    <circle cx="21" cy="25" r="1.5" fill="#990000"/>
    <circle cx="29" cy="25" r="1.5" fill="#990000"/>
    <path d="M16 48 H34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="75" y="34" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#002147" letter-spacing="1">UNIVERSITY OF</text>
  <text x="75" y="55" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="900" fill="#990000" letter-spacing="2">BIRMINGHAM</text>
